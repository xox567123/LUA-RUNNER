<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Language Code Runner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10131a;
      color: #f5f7fa;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-top: 0;
      color: #66d9ef;
    }

    .description {
      color: #aeb7c4;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      margin: 0;
      padding: 11px 18px;
      border: 1px solid #354052;
      border-radius: 8px;
      background: #181d27;
      color: #cbd5e1;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab:hover {
      background: #252d3b;
    }

    .tab.active {
      background: #66d9ef;
      color: #10131a;
      border-color: #66d9ef;
    }

    textarea {
      width: 100%;
      height: 360px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #354052;
      border-radius: 10px;
      background: #181d27;
      color: #f8f8f2;
      font-family: Consolas, Monaco, monospace;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #66d9ef;
    }

    button#runButton {
      margin-top: 14px;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #66d9ef;
      color: #10131a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button#runButton:hover {
      background: #8be9fd;
    }

    button#runButton:active {
      transform: scale(0.98);
    }

    .output-title {
      margin-top: 28px;
      margin-bottom: 8px;
      color: #a6e22e;
    }

    pre,
    iframe {
      width: 100%;
      min-height: 180px;
      margin: 0;
      padding: 16px;
      border-radius: 10px;
      background: #080a0f;
      border: 1px solid #354052;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      font-family: Consolas, Monaco, monospace;
      color: #f8f8f2;
    }

    iframe {
      padding: 0;
      background: white;
      display: none;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #a6e22e;
    }

    .info {
      color: #f8f8f2;
    }

    .language-note {
      margin-top: 10px;
      color: #8893a3;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Multi-Language Code Runner</h1>

    <p class="description">
      Choose a language, enter your code, and click Run Code.
    </p>

    <div class="tabs">
      <button class="tab active" data-language="javascript">
        JavaScript
      </button>

      <button class="tab" data-language="lua">
        Lua
      </button>

      <button class="tab" data-language="python">
        Python
      </button>

      <button class="tab" data-language="html">
        HTML Preview
      </button>
    </div>

    <textarea id="codeEditor"></textarea>

    <div class="language-note" id="languageNote">
      JavaScript runs directly in your browser.
    </div>

    <button id="runButton">Run Code</button>

    <h2 class="output-title">Output</h2>

    <pre id="output">Click "Run Code" to run your code.</pre>

    <iframe id="htmlPreview" title="HTML Preview"></iframe>
  </div>

  <!-- Fengari runs Lua inside the browser -->
  <script src="https://unpkg.com/fengari-web/dist/fengari-web.js"></script>

  <!-- Pyodide runs Python inside the browser -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

  <script>
    const codeEditor = document.getElementById("codeEditor");
    const runButton = document.getElementById("runButton");
    const output = document.getElementById("output");
    const htmlPreview = document.getElementById("htmlPreview");
    const languageNote = document.getElementById("languageNote");
    const tabs = document.querySelectorAll(".tab");

    let currentLanguage = "javascript";
    let pyodide = null;
    let pyodideLoading = false;

    const starterCode = {
      javascript: `console.log("Hello from JavaScript!");

const number = 10 + 5;
console.log("The answer is:", number);`,

      lua: `print("Hello from Lua!")

local number = 10 + 5
print("The answer is: " .. number)`,

      python: `print("Hello from Python!")

number = 10 + 5
print("The answer is:", number)`,

      html: `<!DOCTYPE html>
<html>
<head>
  <title>My Preview</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: white;
      color: #222;
    }

    h1 {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <h1>Hello from HTML!</h1>
  <p>This page is being previewed inside the runner.</p>
</body>
</html>`
    };

    codeEditor.value = starterCode.javascript;

    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        switchLanguage(tab.dataset.language);
      });
    });

    runButton.addEventListener("click", runCode);

    function switchLanguage(language) {
      currentLanguage = language;

      tabs.forEach(function(tab) {
        tab.classList.toggle(
          "active",
          tab.dataset.language === language
        );
      });

      codeEditor.value = starterCode[language];

      output.className = "info";
      output.textContent =
        "Click \"Run Code\" to run your " +
        getLanguageName(language) +
        " code.";

      htmlPreview.style.display = "none";
      output.style.display = "block";

      if (language === "javascript") {
        languageNote.textContent =
          "JavaScript runs directly in your browser.";
      } else if (language === "lua") {
        languageNote.textContent =
          "Lua runs in your browser using Fengari.";
      } else if (language === "python") {
        languageNote.textContent =
          "Python runs in your browser using Pyodide. The first run may take a moment.";
      } else if (language === "html") {
        languageNote.textContent =
          "HTML is shown in the preview window below.";
      }
    }

    function getLanguageName(language) {
      if (language === "javascript") return "JavaScript";
      if (language === "lua") return "Lua";
      if (language === "python") return "Python";
      if (language === "html") return "HTML";
      return language;
    }

    async function runCode() {
      const code = codeEditor.value;

      output.className = "";
      output.textContent = "";
      htmlPreview.style.display = "none";
      output.style.display = "block";

      if (!code.trim()) {
        output.className = "error";
        output.textContent = "Please enter some code first.";
        return;
      }

      if (currentLanguage === "javascript") {
        runJavaScript(code);
      } else if (currentLanguage === "lua") {
        runLua(code);
      } else if (currentLanguage === "python") {
        await runPython(code);
      } else if (currentLanguage === "html") {
        runHTML(code);
      }
    }

    function runJavaScript(code) {
      let printedOutput = "";
      const originalLog = console.log;
      const originalError = console.error;
      const originalWarn = console.warn;

      function addOutput(values) {
        printedOutput += values.map(function(value) {
          return convertValueToText(value);
        }).join("\t") + "\n";
      }

      try {
        console.log = function(...values) {
          addOutput(values);
        };

        console.error = function(...values) {
          addOutput(["Error:", ...values]);
        };

        console.warn = function(...values) {
          addOutput(["Warning:", ...values]);
        };

        const result = new Function(code)();

        if (
          result !== undefined &&
          printedOutput.trim() === ""
        ) {
          printedOutput = convertValueToText(result) + "\n";
        }

        output.className = "success";
        output.textContent =
          printedOutput || "JavaScript finished successfully with no output.";
      } catch (error) {
        output.className = "error";
        output.textContent =
          "JavaScript Error:\n" + error.message;
      } finally {
        console.log = originalLog;
        console.error = originalError;
        console.warn = originalWarn;
      }
    }

    function convertValueToText(value) {
      if (typeof value === "string") {
        return value;
      }

      if (value === null) {
        return "null";
      }

      if (value === undefined) {
        return "undefined";
      }

      if (typeof value === "object") {
        try {
          return JSON.stringify(value);
        } catch {
          return String(value);
        }
      }

      return String(value);
    }

    function runLua(code) {
      let printedOutput = "";

      try {
        const lua = fengari.lua;
        const lauxlib = fengari.lauxlib;
        const lualib = fengari.lualib;
        const to_luastring = fengari.to_luastring;
        const to_jsstring = fengari.to_jsstring;

        const state = lauxlib.luaL_newstate();

        if (!state) {
          throw new Error("Could not create the Lua state.");
        }

        lualib.luaL_openlibs(state);

        lua.lua_pushjsfunction(state, function(luaState) {
          const argumentCount = lua.lua_gettop(luaState);
          const values = [];

          for (let i = 1; i <= argumentCount; i++) {
            const value = lua.lua_tostring(luaState, i);

            if (value === null) {
              values.push("nil");
            } else {
              values.push(to_jsstring(value));
            }
          }

          printedOutput += values.join("\t") + "\n";
          return 0;
        });

        lua.lua_setglobal(
          state,
          to_luastring("print")
        );

        const loadResult = lauxlib.luaL_loadstring(
          state,
          to_luastring(code)
        );

        if (loadResult !== lua.LUA_OK) {
          const errorValue = lua.lua_tostring(state, -1);
          const errorMessage = errorValue
            ? to_jsstring(errorValue)
            : "Unknown Lua syntax error.";

          throw new Error(errorMessage);
        }

        const runResult = lua.lua_pcall(
          state,
          0,
          lua.LUA_MULTRET,
          0
        );

        if (runResult !== lua.LUA_OK) {
          const errorValue = lua.lua_tostring(state, -1);
          const errorMessage = errorValue
            ? to_jsstring(errorValue)
            : "Unknown Lua runtime error.";

          throw new Error(errorMessage);
        }

        output.className = "success";
        output.textContent =
          printedOutput || "Lua finished successfully with no output.";
      } catch (error) {
        output.className = "error";
        output.textContent =
          "Lua Error:\n" + error.message;
      }
    }

    async function runPython(code) {
      output.className = "info";
      output.textContent = "Loading Python...";

      try {
        if (!pyodide) {
          if (!pyodideLoading) {
            pyodideLoading = true;
            pyodide = await loadPyodide();
          } else {
            while (!pyodide) {
              await new Promise(function(resolve) {
                setTimeout(resolve, 100);
              });
            }
          }
        }

        let printedOutput = "";

        pyodide.setStdout({
          batched: function(text) {
            printedOutput += text + "\n";
          }
        });

        pyodide.setStderr({
          batched: function(text) {
            printedOutput += text + "\n";
          }
        });

        await pyodide.runPythonAsync(code);

        output.className = "success";
        output.textContent =
          printedOutput || "Python finished successfully with no output.";
      } catch (error) {
        output.className = "error";
        output.textContent =
          "Python Error:\n" + error.message;
      }
    }

    function runHTML(code) {
      output.style.display = "none";
      htmlPreview.style.display = "block";
      htmlPreview.srcdoc = code;
    }
  </script>
</body>
</html>
